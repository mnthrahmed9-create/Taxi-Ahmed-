<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IRAQ MIND MAP 3D</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root{
  --bg:#050b14;
  --panel:#08182aeF;
  --line:#1c5a7c;
  --accent:#3fdcff;
  --gold:#e8c97e;
  --ok:#38e8a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:#eaf6ff;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}
#map{position:absolute;inset:0}

/* شاشة التحميل */
#loading{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#0b2137,#04080f 70%);
  text-align:center;padding:24px;transition:opacity .5s;
}
#loading h1{
  margin:0 0 6px;font-size:26px;letter-spacing:3px;
  color:var(--accent);text-shadow:0 0 22px #00c8ff88;
}
#loading .sub{font-size:13px;color:#8fb6cc;margin-bottom:22px}
#loading .ring{
  width:64px;height:64px;border-radius:50%;
  border:3px solid #12314a;border-top-color:var(--accent);
  animation:spin 1s linear infinite;margin-bottom:22px;
}
@keyframes spin{to{transform:rotate(360deg)}}
#bar{
  width:min(340px,80vw);height:5px;border-radius:5px;
  background:#0e2438;overflow:hidden;margin-top:6px;
}
#bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#1aa8d8,#4bffd0);
  transition:width .4s ease;
  box-shadow:0 0 12px #3fdcff;
}
#loadText{font-size:13px;color:#9fc4d8;margin:14px 0 0;line-height:1.9;max-width:420px}
.retryBtn{
  margin-top:16px;padding:10px 22px;
  background:#1a5175;color:#fff;
  border:1px solid #2a7ca3;border-radius:9px;
  cursor:pointer;font-family:inherit;font-size:13px;
  transition:.16s;
}
.retryBtn:hover{background:#2372a1}

/* الشريط العلوي */
#header{
  position:absolute;top:12px;left:12px;right:12px;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  pointer-events:none;
}
.logo,.status{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;padding:9px 13px;
  font-size:11px;line-height:1.7;
  backdrop-filter:blur(14px);
  pointer-events:auto;
  box-shadow:0 8px 30px #0009;
}
.logo strong{color:var(--accent);font-size:14px;letter-spacing:1.5px}
.logo small{color:#7ea8c0;font-size:10px}
.status{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:#a8d4e8;white-space:nowrap;
}
.status b{color:var(--ok);font-weight:600}
.dotlive{
  width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 10px var(--ok);animation:blink 1.8s infinite;
}
@keyframes blink{50%{opacity:.25}}

button{font-family:inherit}
.tool{
  padding:11px 15px;color:#dff4ff;font-size:12px;cursor:pointer;
  background:#0a2136eF;border:1px solid #2a7ca3;border-radius:11px;
  backdrop-filter:blur(10px);
  transition:.18s;white-space:nowrap;
  box-shadow:0 4px 18px #0007;
}
.tool:hover{background:#12405f;border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.tool.on{background:#0d4a68;border-color:var(--accent);color:#fff;box-shadow:0 0 18px #1fa9d755}

/* لوحة التفاصيل */
#panel{
  position:absolute;z-index:25;right:12px;top:74px;bottom:12px;
  width:min(340px,86vw);
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:16px;
  overflow-y:auto;display:none;
  box-shadow:0 18px 60px #000a;
  backdrop-filter:blur(16px);
  animation:slideIn .35s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:#1d5170;border-radius:4px}
#panel h2{
  color:var(--accent);margin:0 0 4px;font-size:19px;
  text-shadow:0 0 16px #00c8ff55;
}
#panel .enName{font-size:11px;color:#7ea8c0;margin:0 0 14px;letter-spacing:.5px}
#panel h3{
  color:var(--gold);font-size:12px;margin:20px 0 9px;
  letter-spacing:.6px;border-bottom:1px solid #13374e;padding-bottom:6px;
}
#panel p{font-size:12.5px;line-height:1.9;color:#cfe3ef;margin:0 0 8px}

.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.stat{
  background:#0b2438;border:1px solid #14405c;border-radius:11px;
  padding:9px 10px;
}
.stat span{display:block;font-size:10px;color:#7ea8c0;margin-bottom:3px}
.stat b{font-size:14px;color:#fff;font-weight:600}
.stat b em{font-size:10px;color:#8fb6cc;font-style:normal}

#branches{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#branches button{
  width:100%;padding:10px 8px;font-size:11.5px;
  border:1px solid #1d5876;border-radius:10px;
  background:#0c2639;color:#dff4ff;cursor:pointer;
  transition:.16s;text-align:center;
}
#branches button:hover{background:#154a68;border-color:var(--accent)}
#branches button.active{
  background:#0f5578;border-color:var(--accent);
  box-shadow:0 0 16px #1fa9d766;color:#fff;
}

.panelActions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.panelActions button{
  flex:1;min-width:110px;padding:11px;
  border-radius:11px;cursor:pointer;font-size:12px;
  border:1px solid #2a7ca3;background:#0f3550;color:#eaf6ff;
  transition:.16s;
}
.panelActions button:hover{background:#17557a;border-color:var(--accent)}
.panelActions button.danger{border-color:#a3455c;background:#3a1520;color:#ffc9d4}
.panelActions button.danger:hover{background:#55202e}

#close{
  position:absolute;left:12px;top:12px;width:30px;height:30px;
  background:#123b55;color:#cfe9f6;border:0;border-radius:9px;
  cursor:pointer;font-size:14px;transition:.16s;
}
#close:hover{background:#1d6288;color:#fff}

/* قائمة المحافظات */
#sideList{
  position:absolute;z-index:22;left:12px;top:74px;bottom:12px;
  width:min(255px,80vw);
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:12px;
  display:flex;flex-direction:column;
  box-shadow:0 18px 60px #000a;
  backdrop-filter:blur(16px);
  transition:transform .3s ease,opacity .3s ease;
}
#sideList.hidden{transform:translateX(-115%);opacity:0;pointer-events:none}
#sideList h4{
  margin:2px 0 10px;font-size:12px;color:var(--gold);letter-spacing:.5px;
  display:flex;justify-content:space-between;align-items:center;
}
#search{
  width:100%;padding:9px 11px;margin-bottom:9px;
  background:#0a1f31;border:1px solid #1d5876;border-radius:10px;
  color:#eaf6ff;font-size:12px;font-family:inherit;outline:none;
  transition:.16s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #1fa9d733}
#search::placeholder{color:#5c86a0}

#provList{overflow-y:auto;flex:1;padding-left:2px}
#provList::-webkit-scrollbar{width:5px}
#provList::-webkit-scrollbar-thumb{background:#1d5170;border-radius:4px}
.provItem{
  display:flex;align-items:center;gap:9px;
  padding:8px 9px;border-radius:10px;cursor:pointer;
  font-size:12.5px;color:#cfe3ef;transition:.15s;
  border:1px solid transparent;
}
.provItem:hover{background:#0f2c42;border-color:#1d5876}
.provItem.active{background:#10425e;border-color:var(--accent);color:#fff}
.provItem .swatch{
  width:11px;height:11px;border-radius:3px;flex-shrink:0;
  box-shadow:0 0 8px currentColor;
}
.provItem .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* الأدوات */
#tools{
  position:absolute;bottom:15px;left:12px;z-index:23;
  display:flex;flex-wrap:wrap;gap:7px;max-width:min(340px,60vw);
}

/* العُقد */
.node{width:0;height:0;cursor:pointer;z-index:2}
.node .dot{
  position:absolute;left:-7px;top:-7px;
  width:14px;height:14px;border-radius:50%;
  background:#2ae4ff;border:2px solid #fff;
  box-shadow:0 0 10px #00dfff,0 0 24px #00dfff;
  animation:pulse 2.6s infinite;
  transition:.2s;
}
.node:hover .dot{transform:scale(1.35);background:#fff}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 #2ae4ff88,0 0 12px #00dfff}
  55%{box-shadow:0 0 0 11px #2ae4ff00,0 0 22px #00dfff}
}
.node-label{
  position:absolute;left:50%;bottom:13px;transform:translateX(-50%);
  background:#06131fed;border:1px solid #2f9cc4;
  border-radius:8px;padding:3px 8px;
  color:#eaf6ff;white-space:nowrap;font-size:11px;
  pointer-events:none;
  box-shadow:0 4px 14px #0008;
  transition:.18s;
}
.node:hover .node-label{background:#0d3f5c;border-color:var(--accent);color:#fff}

/* إشعار */
#toast{
  position:absolute;z-index:70;bottom:80px;right:50%;transform:translateX(50%) translateY(20px);
  background:#0b2c42ee;border:1px solid #2a7ca3;border-radius:12px;
  padding:11px 18px;font-size:12.5px;color:#dff4ff;
  opacity:0;pointer-events:none;transition:.3s;
  box-shadow:0 10px 40px #000a;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}

@media(max-width:720px){
  #sideList{width:min(240px,74vw);top:120px}
  #panel{width:min(320px,90vw);top:120px}
  #tools{max-width:calc(100vw - 24px);bottom:78px}
  .tool{padding:9px 12px;font-size:11px}
  #header{top:8px;left:8px;right:8px}
  .logo{padding:7px 10px}
  .logo strong{font-size:12px}
  .status{font-size:10px;padding:7px 10px}
}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">
  <div class="ring"></div>
  <h1>IRAQ MIND MAP 3D</h1>
  <div class="sub">الخريطة الذهنية الجغرافية للعراق</div>
  <div id="bar"><i></i></div>
  <p id="loadText">جاري تهيئة المحرك ثلاثي الأبعاد...</p>
</div>

<div id="header">
  <div class="logo">
    <strong>IRAQ MIND MAP 3D</strong><br>
    <small>الخريطة الذهنية الجغرافية</small>
  </div>

    <span class="dotlive"></span>

  </div>
</div>

    <span>محافظات العراق</span>
    <span id="provCount" style="color:#5c86a0;font-size:10px">—</span>

</div>

  <button id="close" title="إغلاق">✕</button>
  <h2 id="provinceName">المحافظة</h2>
  <p class="enName" id="provinceEn"></p>
  <p id="provinceInfo">معلومات المحافظة</p>

  <div class="statGrid" id="statGrid"></div>

  <h3>✦ الفروع الذهنية</h3>
  <div id="branches"></div>

  <h3>✦ المعلومات الإدارية</h3>
  <div id="adminInfo"></div>

  <div class="panelActions">
    <button id="zoomProvince">تكبير المحافظة</button>
    <button id="showAll">عرض العراق كاملاً</button>
    <button id="clearBranch" class="danger">مسح الفروع</button>
  </div>
</div>

<div id="tools">
  <button class="tool" id="reset">🏠 إعادة العرض</button>
  <button class="tool on" id="terrain">⛰️ تضاريس 3D</button>
  <button class="tool on" id="labels">🏷️ الأسماء</button>
  <button class="tool" id="toggleList">📋 القائمة</button>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   IRAQ MIND MAP 3D  —  نسخة مُصلحة ومُحسّنة
   ========================================================= */

/* ---------------- البيانات المحلية ---------------- */
const PROVINCE_META = [
 {ar:'بغداد',    en:'Baghdad',        cap:'بغداد',     area:4555,   pop:8126000, c:[44.366,33.315], note:'العاصمة الاتحادية ومركز الثقل السياسي والاقتصادي في العراق.'},
 {ar:'البصرة',   en:'Basra',          cap:'البصرة',    area:19070,  pop:3000000, c:[47.783,30.508], note:'الميناء الرئيسي وقلب العراق الاقتصادي البحري.'},
 {ar:'نينوى',    en:'Nineveh',        cap:'الموصل',    area:37323,  pop:3800000, c:[43.118,36.335], note:'أكبر المحافظات سكاناً في شمال العراق وموطن آثار نينوى.'},
 {ar:'أربيل',    en:'Erbil',          cap:'أربيل',     area:15074,  pop:1900000, c:[44.009,36.191], note:'عاصمة إقليم كردستان وأقدم المدن المأهولة تاريخياً.'},
 {ar:'النجف',    en:'Najaf',          cap:'النجف',     area:28824,  pop:1500000, c:[44.333,32.000], note:'مركز ديني عالمي وموطن مرقد الإمام علي ووادي السلام.'},
 {ar:'كربلاء',   en:'Karbala',        cap:'كربلاء',    area:5034,   pop:1200000, c:[44.024,32.616], note:'مدينة الإمام الحسين ومحطة زيارة عالمية كبرى.'},
 {ar:'بابل',     en:'Babylon',        cap:'الحلة',     area:5603,   pop:2000000, c:[44.433,32.483], note:'موطن حضارة بابل وآثارها المدرجة عالمياً.'},
 {ar:'الأنبار',  en:'Anbar',          cap:'الرمادي',   area:138501, pop:1700000, c:[43.300,33.425], note:'أكبر محافظات العراق مساحةً وتشكل ثلث البلاد تقريباً.'},
 {ar:'ديالى',    en:'Diyala',         cap:'بعقوبة',    area:17685,  pop:1600000, c:[44.643,33.745], note:'بوابة العراق الشرقية وسلة حمضيات البلاد.'},
 {ar:'ذي قار',   en:'Dhi Qar',        cap:'الناصرية',  area:12900,  pop:2200000, c:[46.257,31.043], note:'موطن حضارة أور السومرية والزقورة الشهيرة.'},
 {ar:'ميسان',    en:'Maysan',         cap:'العمارة',   area:16072,  pop:1100000, c:[47.144,31.835], note:'أرض الأهوار والمسطحات المائية الجنوبية.'},
 {ar:'المثنى',   en:'Muthanna',       cap:'السماوة',   area:51740,  pop:800000,  c:[45.280,31.311], note:'محافظة صحراوية واسعة على الحدود الجنوبية.'},
 {ar:'القادسية', en:'Qadisiyyah',     cap:'الديوانية', area:8153,   pop:1300000, c:[44.925,31.992], note:'سلة الحبوب في الفرات الأوسط.'},
 {ar:'واسط',     en:'Wasit',          cap:'الكوت',     area:17153,  pop:1400000, c:[45.818,32.512], note:'تحتضن سد الكوت وأراضي زراعية خصبة.'},
 {ar:'صلاح الدين',en:'Saladin',       cap:'تكريت',     area:24751,  pop:1600000, c:[43.678,34.607], note:'محافظة تاريخية على ضفاف دجلة وسط العراق.'},
 {ar:'كركوك',    en:'Kirkuk',         cap:'كركوك',     area:9679,   pop:1600000, c:[44.392,35.468], note:'مدينة النفط والتعدد القومي في شمال العراق.'},
 {ar:'دهوك',     en:'Duhok',          cap:'دهوك',      area:6553,   pop:1300000, c:[42.988,36.867], note:'محافظة جبلية خلابة على الحدود الشمالية.'},
 {ar:'السليمانية',en:'Sulaymaniyah',  cap:'السليمانية',area:17023,  pop:2000000, c:[45.436,35.561], note:'مركز ثقافي كردي وموطن جبال حمرين وأزمر.'}
];

const COLORS = [
 '#18c6ea','#3f8ee0','#17b3a4','#9a6ce8','#e8a04a','#2ec6d6',
 '#dd6f9a','#4fb37c','#bb93e3','#46a0e0','#dcb04d','#4fcbb0',
 '#a97ce0','#e88a5a','#3ba0b8','#c075a3','#57b97e','#dcb75c'
];

function norm(s){
  return String(s||'')
    .replace(/[أإآٱ]/g,'ا')
    .replace(/[ىئ]/g,'ي')
    .replace(/ؤ/g,'و')
    .replace(/ة/g,'ه')
    .replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/^ال/,'')
    .replace(/[\s\-_]+/g,'')
    .trim().toLowerCase();
}

const META_INDEX = new Map();
PROVINCE_META.forEach(m=>{
  META_INDEX.set(norm(m.ar), m);
  META_INDEX.set(norm(m.en), m);
});
function lookupMeta(name){ return META_INDEX.get(norm(name)) || null; }

/* ---------------- الحالة ---------------- */
let PROVINCES = [];
let selectedIdx = null;
let hoveredIdx  = null;
let terrainOn   = true;
let labelsOn    = true;
let osmtogeojsonReady = false;
let mapLoaded   = false;
let osmLoaded   = false;

const IRAQ_BOUNDS = [[38.70,29.00],[48.70,37.40]];

/* ---------------- الخريطة ---------------- */
const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[43.8,33.2],
  zoom:5.2,
  pitch:52,
  bearing:-8,
  maxPitch:85,
  minZoom:3.5,
  maxZoom:18,
  antialias:true,
  attributionControl:false
});

map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'bottom-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric',maxWidth:120}), 'bottom-right');

map.on('error', e=>{
  if(e && e.error && /tile|404|Failed to fetch/i.test(e.error.message||'')) return;
  if(e && e.error) console.warn('Map:', e.error.message);
});

/* ---------------- أدوات ---------------- */
const $ = id => document.getElementById(id);
const bar = document.querySelector('#bar > i');

function progress(p, txt){
  if(bar) bar.style.width = Math.min(100,p) + '%';
  const el = $('loadText');
  if(el && txt) el.textContent = txt;
}
function setStatus(html){
  const el = $('status');
  if(el) el.innerHTML = '<span class="dotlive"></span>' + html;
}
let toastTimer = null;
function toast(msg, ms){
  const t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms||3200);
}
function fmtNum(n){
  if(n === null || n === undefined) return '—';
  return Number(n).toLocaleString('en-US');
}
function hideLoading(){
  const l = $('loading');
  if(!l) return;
  l.style.opacity = '0';
  setTimeout(()=>{ l.style.display = 'none'; }, 550);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, r)=> setTimeout(()=>r(new Error('timeout')), ms))
  ]);
}

/* ---------------- تحميل osmtogeojson ---------------- */
function ensureOSMToGeoJSON(){
  if(osmtogeojsonReady) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    if(window.osmtogeojson){ osmtogeojsonReady = true; return resolve(); }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0/osmtogeojson.js';
    s.onload = ()=>{ osmtogeojsonReady = true; resolve(); };
    s.onerror = ()=> reject(new Error('فشل تحميل osmtogeojson'));
    document.head.appendChild(s);
  });
}

/* ---------------- Overpass ---------------- */
const OVERPASS_SERVERS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];

const OVERPASS_QUERY = `[out:json][timeout:25];
area["ISO3166-1"="IQ"]["admin_level"="2"]->.a;
relation["boundary"="administrative"]["admin_level"="4"](area.a);
out body geom;`;

async function fetchOverpass(query, server, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(server, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data=' + encodeURIComponent(query),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err){
    clearTimeout(timer);
    throw err;
  }
}

async function loadProvincesFromOSM(){
  let lastErr = null;
  for(let si=0; si<OVERPASS_SERVERS.length; si++){
    try{
      const data = await fetchOverpass(OVERPASS_QUERY, OVERPASS_SERVERS[si], 12000);
      if(data && Array.isArray(data.elements) && data.elements.length){
        return data;
      }
      lastErr = new Error('empty result');
    } catch(err){
      lastErr = err;
      console.warn('Overpass attempt failed:', OVERPASS_SERVERS[si], err.message);
    }
  }
  throw lastErr || new Error('تعذر الاتصال بـ Overpass');
}

/* ---------------- بناء المحافظات ---------------- */
function bboxOf(geometry){
  let minX=180,minY=90,maxX=-180,maxY=-90;
  (function walk(c){
    if(typeof c[0] === 'number'){
      if(c[0]<minX) minX=c[0];
      if(c[0]>maxX) maxX=c[0];
      if(c[1]<minY) minY=c[1];
      if(c[1]>maxY) maxY=c[1];
    } else {
      for(let i=0;i<c.length;i++) walk(c[i]);
    }
  })(geometry.coordinates);
  return [minX,minY,maxX,maxY];
}

function buildProvinces(geojson){
  const list = [];
  const features = (geojson && geojson.features) || [];

  features.forEach((f, i)=>{
    if(!f.geometry) return;
    const t = f.geometry.type;
    if(t !== 'Polygon' && t !== 'MultiPolygon') return;

    const tags = (f.properties && f.properties.tags) || {};
    const rawName = tags['name:ar'] || tags.name || tags['name:en'] || ('محافظة ' + (i+1));
    const meta = lookupMeta(rawName) || lookupMeta(tags['name:en']) || lookupMeta(tags.name) || null;

    const bb = bboxOf(f.geometry);
    const bboxCenter = [(bb[0]+bb[2])/2, (bb[1]+bb[3])/2];

    // معرف OSM
    let osmId = null;
    if(f.properties && f.properties.id != null) osmId = f.properties.id;
    else if(f.id != null) osmId = f.id;

    list.push({
      idx: list.length,
      name: meta ? meta.ar : rawName,
      nameEn: tags['name:en'] || (meta ? meta.en : '') || '',
      color: COLORS[list.length % COLORS.length],
      center: meta ? meta.c : bboxCenter,
      bbox: bb,
      cap: meta ? meta.cap : '',
      area: meta ? meta.area : null,
      pop: meta ? meta.pop : null,
      note: meta ? meta.note : '',
      geometry: f.geometry,
      osmId: osmId
    });
  });

  // وضع احتياطي بالبيانات المحلية
  if(!list.length){
    PROVINCE_META.forEach((m,i)=>{
      list.push({
        idx:i, name:m.ar, nameEn:m.en,
        color: COLORS[i % COLORS.length],
        center:m.c, bbox:[m.c[0]-0.25, m.c[1]-0.25, m.c[0]+0.25, m.c[1]+0.25],
        cap:m.cap, area:m.area, pop:m.pop, note:m.note,
        geometry:null, osmId:null
      });
    });
  }

  return list;
}

/* ---------------- حذف الطبقات ---------------- */
function clearMapData(){
  PROVINCES.forEach(p=>{
    if(p.marker){ try{ p.marker.remove(); }catch(e){} }
  });
  ['province-border','province-glow','province-3d'].forEach(id=>{
    try{ if(map.getLayer(id)) map.removeLayer(id); }catch(e){}
  });
  try{ if(map.getSource('provinces')) map.removeSource('provinces'); }catch(e){}
  const list = $('provList');
  if(list) list.innerHTML = '';
  selectedIdx = null;
  hoveredIdx = null;
}

/* ---------------- إضافة طبقات المحافظات ---------------- */
function addProvinceLayers(){
  const withGeom = PROVINCES.filter(p=>p.geometry);

  if(withGeom.length){
    const fc = {
      type:'FeatureCollection',
      features: withGeom.map(p=>({
        type:'Feature',
        id: p.idx,
        geometry: p.geometry,
        properties:{ idx: p.idx, name: p.name, color: p.color }
      }))
    };

    map.addSource('provinces', { type:'geojson', data:fc });

    map.addLayer({
      id:'province-3d',
      type:'fill-extrusion',
      source:'provinces',
      paint:{
        'fill-extrusion-color':[
          'case',
          ['boolean',['feature-state','selected'],false], '#ffffff',
          ['boolean',['feature-state','hover'],false],    '#8df3ff',
          ['get','color']
        ],
        'fill-extrusion-height':[
          'case',
          ['boolean',['feature-state','selected'],false], 3200,
          ['boolean',['feature-state','hover'],false],    2500,
          1600
        ],
        'fill-extrusion-base':0,
        'fill-extrusion-opacity':0.62,
        'fill-extrusion-vertical-gradient':true
      }
    });

    map.addLayer({
      id:'province-glow',
      type:'line',
      source:'provinces',
      layout:{ 'line-join':'round', 'line-cap':'round' },
      paint:{
        'line-color':'#3fdcff',
        'line-width':9,
        'line-opacity':0.18,
        'line-blur':7
      }
    });

    map.addLayer({
      id:'province-border',
      type:'line',
      source:'provinces',
      layout:{ 'line-join':'round', 'line-cap':'round' },
      paint:{
        'line-color':'#a8f4ff',
        'line-width':[
          'case',
          ['boolean',['feature-state','selected'],false], 3.5,
          ['boolean',['feature-state','hover'],false],    3,
          2
        ],
        'line-opacity':0.92
      }
    });

    map.on('mousemove','province-3d', e=>{
      if(!e.features || !e.features.length) return;
      map.getCanvas().style.cursor = 'pointer';
      const id = e.features[0].id;
      if(hoveredIdx === id) return;
      if(hoveredIdx !== null){
        try{ map.setFeatureState({source:'provinces', id:hoveredIdx}, {hover:false}); }catch(e){}
      }
      hoveredIdx = id;
      try{ map.setFeatureState({source:'provinces', id:hoveredIdx}, {hover:true}); }catch(e){}
    });

    map.on('mouseleave','province-3d', ()=>{
      map.getCanvas().style.cursor = '';
      if(hoveredIdx !== null){
        try{ map.setFeatureState({source:'provinces', id:hoveredIdx}, {hover:false}); }catch(e){}
        hoveredIdx = null;
      }
    });

    map.on('click','province-3d', e=>{
      if(!e.features || !e.features.length) return;
      selectProvince(e.features[0].id);
    });
  }

  map.on('click', e=>{
    if(!withGeom.length) return;
    const hits = map.queryRenderedFeatures(e.point, { layers:['province-3d'] });
    if(!hits.length) deselectProvince();
  });

  PROVINCES.forEach(p=>createNode(p));
  renderProvinceList();
}

/* ---------------- العُقد ---------------- */
function createNode(p){
  const el = document.createElement('div');
  el.className = 'node';

  const dot = document.createElement('span');
  dot.className = 'dot';
  el.appendChild(dot);

  const lbl = document.createElement('span');
  lbl.className = 'node-label';
  lbl.textContent = p.name;
  el.appendChild(lbl);

  el.addEventListener('click', ev=>{
    ev.stopPropagation();
    ev.preventDefault();
    selectProvince(p.idx);
  });

  const marker = new maplibregl.Marker({element:el, anchor:'center'})
    .setLngLat(p.center)
    .addTo(map);

  p.marker = marker;
  p.labelEl = lbl;
}

/* ---------------- قائمة المحافظات ---------------- */
function renderProvinceList(){
  const box = $('provList');
  if(!box) return;
  box.innerHTML = '';
  PROVINCES
    .slice()
    .sort((a,b)=>a.name.localeCompare(b.name,'ar'))
    .forEach(p=>{
      const row = document.createElement('div');
      row.className = 'provItem';
      row.dataset.idx = p.idx;

      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = p.color;
      sw.style.color = p.color;

      const tx = document.createElement('span');
      tx.className = 'txt';
      tx.textContent = p.name;

      row.appendChild(sw);
      row.appendChild(tx);

      row.addEventListener('click', ()=>selectProvince(p.idx));
      box.appendChild(row);
    });

  const cnt = $('provCount');
  if(cnt) cnt.textContent = PROVINCES.length + ' محافظة';
}

function syncActiveItem(idx){
  document.querySelectorAll('.provItem').forEach(el=>{
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
  const active = document.querySelector('.provItem.active');
  if(active) active.scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* البحث */
const searchInput = $('search');
if(searchInput){
  searchInput.addEventListener('input', e=>{
    const q = norm(e.target.value);
    document.querySelectorAll('.provItem').forEach(el=>{
      const p = PROVINCES.find(x=>x.idx === Number(el.dataset.idx));
      if(!p) return;
      const hit = !q || norm(p.name).includes(q) || norm(p.nameEn).includes(q);
      el.style.display = hit ? 'flex' : 'none';
    });
  });
}

/* ---------------- التحديد ---------------- */
function deselectProvince(){
  if(selectedIdx === null) return;
  try{
    map.setFeatureState({source:'provinces', id:selectedIdx}, {selected:false});
  }catch(e){}
  selectedIdx = null;
  syncActiveItem(-1);
}

function selectProvince(idx){
  const p = PROVINCES.find(x=>x.idx === idx);
  if(!p) return;

  if(selectedIdx !== null){
    try{ map.setFeatureState({source:'provinces', id:selectedIdx}, {selected:false}); }catch(e){}
  }
  selectedIdx = idx;
  if(p.geometry){
    try{ map.setFeatureState({source:'provinces', id:idx}, {selected:true}); }catch(e){}
  }

  syncActiveItem(idx);
  clearBranch(true);

  const pn = $('provinceName');
  if(pn) pn.textContent = p.name;
  const pe = $('provinceEn');
  if(pe) pe.textContent = p.nameEn ? p.nameEn.toUpperCase() : '';
  const pi = $('provinceInfo');
  if(pi) pi.textContent = p.note || 'محافظة من محافظات العراق.';

  const grid = $('statGrid');
  if(grid){
    grid.innerHTML = '';
    const stats = [
      ['المركز', p.cap || '—', ''],
      ['المساحة', p.area ? fmtNum(p.area) : '—', 'كم²'],
      ['السكان', p.pop ? fmtNum(p.pop) : '—', 'نسمة'],
      ['الكثافة', (p.area && p.pop) ? fmtNum(Math.round(p.pop/p.area)) : '—', 'ن/كم²']
    ];
    stats.forEach(([label,val,unit])=>{
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = '<span>'+label+'</span><b>'+val+
        (unit ? ' <em>'+unit+'</em>' : '') + '</b>';
      grid.appendChild(d);
    });
  }

  const box = $('branches');
  if(box){
    box.innerHTML = '';
    BRANCHES.forEach(b=>{
      const btn = document.createElement('button');
      btn.textContent = b.icon + ' ' + b.label;
      btn.dataset.key = b.key;
      btn.addEventListener('click', ()=>runBranch(b, btn));
      box.appendChild(btn);
    });
  }

  const admin = $('adminInfo');
  if(admin){
    admin.innerHTML = '';
    [
      ['الاسم العربي', p.name],
      ['الاسم الإنجليزي', p.nameEn || '—'],
      ['المركز الإداري', p.cap || '—'],
      ['معرّف OSM', p.osmId != null ? p.osmId : 'غير متوفر'],
      ['المصدر', p.geometry ? 'OpenStreetMap' : 'بيانات محلية']
    ].forEach(([k,v])=>{
      const el = document.createElement('p');
      el.textContent = k + ': ' + v;
      admin.appendChild(el);
    });
  }

  const panel = $('panel');
  if(panel) panel.style.display = 'block';

  if(p.bbox){
    map.fitBounds([[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]], {
      padding:{top:90,bottom:90,left:60,right:360},
      pitch:58, bearing:-6, duration:1400, maxZoom:9.5
    });
  } else {
    map.flyTo({center:p.center, zoom:8, pitch:60, duration:1200});
  }
}

/* ---------------- الفروع ---------------- */
const BRANCHES = [
  {key:'cities',   label:'المدن',    icon:'🏙', q:'node["place"~"city|town"]'},
  {key:'districts',label:'الأقضية',  icon:'🗂', q:'relation["boundary"="administrative"]["admin_level"~"6|7"]'},
  {key:'roads',    label:'الطرق',    icon:'🛣', q:'way["highway"~"motorway|trunk|primary"]'},
  {key:'water',    label:'المياه',   icon:'💧', q:'way["waterway"~"river|canal"]'},
  {key:'tourism',  label:'المعالم',  icon:'🏛', q:'node["tourism"~"attraction|museum|monument"]'},
  {key:'airports', label:'المطارات', icon:'✈', q:'node["aeroway"="aerodrome"]'}
];

function clearBranch(silent){
  ['branch-fill','branch-line','branch-point'].forEach(id=>{
    try{ if(map.getLayer(id)) map.removeLayer(id); }catch(e){}
  });
  try{ if(map.getSource('branch')) map.removeSource('branch'); }catch(e){}
  document.querySelectorAll('#branches button').forEach(b=>b.classList.remove('active'));
  if(!silent) toast('تم مسح الفروع من الخريطة');
}

async function runBranch(branch, btn){
  if(selectedIdx === null) return;
  const p = PROVINCES.find(x=>x.idx === selectedIdx);
  if(!p) return;

  if(p.osmId === null || p.osmId === undefined){
    toast('لا تتوفر بيانات OSM لهذه المحافظة');
    return;
  }

  if(btn.classList.contains('active')){
    clearBranch();
    return;
  }

  clearBranch(true);
  btn.classList.add('active');
  toast('جاري جلب ' + branch.label + '...', 8000);

  const areaId = 3600000000 + Number(p.osmId);
  const query =
    '[out:json][timeout:45];\n' +
    'area(' + areaId + ')->.a;\n' +
    branch.q + '(area.a);\n' +
    'out geom 900;';

  let data = null;
  for(const server of OVERPASS_SERVERS){
    try{
      data = await fetchOverpass(query, server, 30000);
      if(data && data.elements && data.elements.length) break;
      data = null;
    } catch(err){
      console.warn('branch fail:', err.message);
    }
  }

  if(!data || !data.elements || !data.elements.length){
    btn.classList.remove('active');
    toast('لم يتم العثور على بيانات لهذا الفرع');
    return;
  }

  try{
    await ensureOSMToGeoJSON();
    let gj = window.osmtogeojson(data, {flatProperties:true});
    if(gj && typeof gj.then === 'function') gj = await gj;

    const feats = (gj.features || []).filter(f=>f.geometry);
    if(!feats.length){ throw new Error('empty'); }

    map.addSource('branch', {
      type:'geojson',
      data:{ type:'FeatureCollection', features:feats }
    });

    map.addLayer({
      id:'branch-fill',
      type:'fill',
      source:'branch',
      paint:{
        'fill-color':'#ffd166',
        'fill-opacity':0.14,
        'fill-outline-color':'#ffd166'
      }
    });

    map.addLayer({
      id:'branch-line',
      type:'line',
      source:'branch',
      paint:{
        'line-color':'#ffd166',
        'line-width':2,
        'line-opacity':0.9,
        'line-blur':0.4
      }
    });

    map.addLayer({
      id:'branch-point',
      type:'circle',
      source:'branch',
      paint:{
        'circle-radius':5,
        'circle-color':'#ffe6a3',
        'circle-stroke-width':1.6,
        'circle-stroke-color':'#8a5c00',
        'circle-opacity':0.95
      }
    });

    toast('✦ ' + branch.label + ': ' + feats.length + ' عنصر');
  } catch(err){
    btn.classList.remove('active');
    toast('تعذر عرض بيانات الفرع');
  }
}

/* ---------------- أزرار ---------------- */
$('close').addEventListener('click', ()=>{
  $('panel').style.display = 'none';
  deselectProvince();
});

$('zoomProvince').addEventListener('click', ()=>{
  if(selectedIdx === null) return;
  const p = PROVINCES.find(x=>x.idx === selectedIdx);
  if(!p) return;
  if(p.bbox){
    map.fitBounds([[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]], {
      padding:80, pitch:70, duration:1300, maxZoom:11
    });
  } else {
    map.flyTo({center:p.center, zoom:10, pitch:70, duration:1200});
  }
});

$('showAll').addEventListener('click', ()=>{
  $('panel').style.display = 'none';
  deselectProvince();
  map.fitBounds(IRAQ_BOUNDS, {padding:40, pitch:45, bearing:0, duration:1500});
});

$('reset').addEventListener('click', ()=>{
  deselectProvince();
  map.fitBounds(IRAQ_BOUNDS, {padding:40, pitch:52, bearing:-8, duration:1600});
});

$('terrain').addEventListener('click', function(){
  terrainOn = !terrainOn;
  this.classList.toggle('on', terrainOn);
  try{
    if(map.getSource('iraq-dem')){
      map.setTerrain(terrainOn ? {source:'iraq-dem', exaggeration:1.35} : null);
    }
  }catch(e){ console.warn(e); }
  toast(terrainOn ? '⛰️ التضاريس مفعّلة' : '🗺️ عرض مسطح');
});

$('labels').addEventListener('click', function(){
  labelsOn = !labelsOn;
  this.classList.toggle('on', labelsOn);
  PROVINCES.forEach(p=>{
    if(p.labelEl) p.labelEl.style.display = labelsOn ? '' : 'none';
  });
});

$('toggleList').addEventListener('click', function(){
  $('sideList').classList.toggle('hidden');
  this.classList.toggle('on', !$('sideList').classList.contains('hidden'));
});

$('clearBranch').addEventListener('click', ()=>clearBranch());

/* ---------------- إعداد الخريطة الأساسية ---------------- */
function setupMapBase(){
  try{
    map.addSource('iraq-dem', {
      type:'raster-dem',
      tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize:256, encoding:'terrarium', maxzoom:14
    });
    map.setTerrain({ source:'iraq-dem', exaggeration:1.35 });
  }catch(err){ console.warn('terrain', err); }

  try{
    if(map.setLight){
      map.setLight({ anchor:'viewport', color:'#ffffff', intensity:0.5, position:[1.2,200,40] });
    }
  }catch(err){ console.warn('light', err); }

  try{
    map.addLayer({
      id:'iraq-hillshade',
      type:'hillshade',
      source:'iraq-dem',
      paint:{
        'hillshade-exaggeration':0.65,
        'hillshade-shadow-color':'#1b2c3d',
        'hillshade-highlight-color':'#ffffff',
        'hillshade-accent-color':'#2a4a63'
      }
    });
  }catch(err){ console.warn('hillshade', err); }

  try{
    map.setFog({
      range:[-0.6,2.2], color:'#0b1a29', 'horizon-blend':0.22,
      'high-color':'#0a1524', 'space-color':'#03060b', 'star-intensity':0.35
    });
  }catch(err){ console.warn('fog', err); }

  try{
    map.addLayer({
      id:'sky', type:'sky',
      paint:{
        'sky-type':'atmosphere',
        'sky-atmosphere-sun':[0,45],
        'sky-atmosphere-sun-intensity':8
      }
    });
  }catch(err){ console.warn('sky', err); }
}

/* ---------------- تحميل OSM في الخلفية ---------------- */
async function loadOSMInBackground(){
  try{
    const osm = await withTimeout(loadProvincesFromOSM(), 25000);
    if(!osm) throw new Error('no data');

    await ensureOSMToGeoJSON();
    let geojson = window.osmtogeojson(osm, {flatProperties:false});
    if(geojson && typeof geojson.then === 'function') geojson = await geojson;

    if(!geojson || !geojson.features || !geojson.features.length){
      throw new Error('empty geojson');
    }

    const newList = buildProvinces(geojson);
    if(!newList.length || !newList.some(x=>x.geometry)) throw new Error('no geometry');

    // استبدال البيانات
    clearMapData();
    PROVINCES = newList;
    addProvinceLayers();
    osmLoaded = true;

    setStatus('تم تحميل <b>' + PROVINCES.length + '</b> محافظة من OSM');
    toast('✓ تم تحديث الحدود من OpenStreetMap');
  }catch(err){
    console.warn('OSM background load failed:', err.message);
    if(!osmLoaded){
      setStatus('وضع محلي — ' + PROVINCES.length + ' محافظة');
    }
  }
}

/* ---------------- بدء التشغيل ---------------- */
map.on('load', ()=>{
  mapLoaded = true;
  console.log('Map loaded');

  try{
    progress(30, 'جاري إعداد التضاريس...');
    setupMapBase();

    progress(60, 'جاري رسم المحافظات...');

    // عرض فوري بالبيانات المحلية
    PROVINCES = buildProvinces(null);
    addProvinceLayers();

    progress(100, 'جاهز!');
    setStatus('وضع محلي — جاري تحديث الحدود...');

    // إخفاء شاشة التحميل فوراً
    setTimeout(hideLoading, 400);

    // تحميل OSM في الخلفية
    loadOSMInBackground();

    // عرض أولي
    setTimeout(()=>{
      map.easeTo({ center:[43.8,33.2], zoom:5.2, pitch:52, bearing:-8, duration:1400 });
    }, 200);

  }catch(err){
    console.error('Setup error:', err);
    progress(100, '⚠️ ' + err.message);
    const el = $('loadText');
    if(el){
      el.innerHTML = '⚠️ خطأ: ' + err.message +
        '<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>';
    }
    setTimeout(hideLoading, 2500);
  }
});

/* شبكة أمان: إخفاء شاشة التحميل إذا تأخر تحميل الخريطة */
setTimeout(()=>{
  if(!mapLoaded){
    const el = $('loadText');
    if(el){
      el.innerHTML = '⚠️ تأخر تحميل الخريطة. تحقق من اتصالك بالإنترنت.' +
        '<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>';
    }
  }
}, 25000);

/* على الجوال: إخفاء القائمة تلقائياً */
if(window.innerWidth < 720){
  setTimeout(()=>$('sideList').classList.add('hidden'), 3500);
}

/* استعادة مؤشر الفأرة */
map.on('mouseout', ()=>{ map.getCanvas().style.cursor = ''; });
