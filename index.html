<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IRAQ MIND MAP 3D — VIVID</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root{
  --bg:#02040a;
  --panel:rgba(8,14,32,0.92);
  --line:#4a2dff;
  --accent:#00f5ff;
  --hotpink:#ff006e;
  --lime:#06ffa5;
  --gold:#ffe600;
  --purple:#b537f2;
  --ok:#00ffa3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:#f0fbff;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}
#map{position:absolute;inset:0}

/* شاشة التحميل */
#loading{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#150036,#020410 65%);
  text-align:center;padding:24px;transition:opacity .5s;
}
#loading h1{
  margin:0 0 6px;font-size:28px;letter-spacing:4px;
  background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600,#06ffa5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;
  filter:drop-shadow(0 0 20px #ff006e99);
}
#loading .sub{font-size:13px;color:#b8d9ff;margin-bottom:22px}
#loading .ring{
  width:70px;height:70px;border-radius:50%;
  border:3px solid transparent;
  border-top-color:#00f5ff;
  border-right-color:#ff006e;
  border-bottom-color:#ffe600;
  animation:spin 1.2s linear infinite;margin-bottom:22px;
  box-shadow:0 0 30px #00f5ff66;
}
@keyframes spin{to{transform:rotate(360deg)}}
#bar{
  width:min(340px,80vw);height:6px;border-radius:6px;
  background:#10082a;overflow:hidden;margin-top:6px;
  border:1px solid #4a2dff55;
}
#bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600,#06ffa5);
  background-size:300% 100%;
  animation:shimmer 2s linear infinite;
  transition:width .4s ease;
  box-shadow:0 0 20px #00f5ffaa;
}
@keyframes shimmer{to{background-position:300% 0}}
#loadText{font-size:13px;color:#b8d9ff;margin:14px 0 0;line-height:1.9;max-width:420px}
.retryBtn{
  margin-top:16px;padding:11px 24px;
  background:linear-gradient(135deg,#ff006e,#b537f2);
  color:#fff;font-weight:700;
  border:0;border-radius:10px;
  cursor:pointer;font-family:inherit;font-size:13px;
  transition:.18s;
  box-shadow:0 4px 20px #ff006e77;
}
.retryBtn:hover{transform:translateY(-1px);box-shadow:0 6px 28px #ff006eaa}

/* الشريط العلوي */
#header{
  position:absolute;top:12px;left:12px;right:12px;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  pointer-events:none;
}
.logo,.status{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;
  font-size:11px;line-height:1.7;
  backdrop-filter:blur(16px);
  pointer-events:auto;
  box-shadow:0 8px 40px #4a2dff55, 0 0 0 1px #4a2dff33 inset;
}
.logo strong{
  font-size:15px;letter-spacing:2px;font-weight:800;
  background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo small{color:#8fb8e8;font-size:10px}
.status{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:#d9ecff;white-space:nowrap;
}
.status b{color:var(--lime);font-weight:700;text-shadow:0 0 12px var(--lime)}
.dotlive{
  width:9px;height:9px;border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 12px var(--lime),0 0 24px var(--lime);
  animation:blink 1.6s infinite;
}
@keyframes blink{50%{opacity:.2;transform:scale(.8)}}

button{font-family:inherit}
.tool{
  padding:11px 15px;color:#fff;font-size:12px;cursor:pointer;font-weight:600;
  background:linear-gradient(135deg,rgba(20,10,50,.92),rgba(10,30,60,.92));
  border:1px solid #4a2dff;border-radius:11px;
  backdrop-filter:blur(12px);
  transition:.18s;white-space:nowrap;
  box-shadow:0 4px 20px #4a2dff44;
}
.tool:hover{
  background:linear-gradient(135deg,#4a2dff,#b537f2);
  border-color:#00f5ff;color:#fff;transform:translateY(-1px);
  box-shadow:0 6px 30px #b537f288;
}
.tool.on{
  background:linear-gradient(135deg,#00f5ff,#06ffa5);
  border-color:#00f5ff;color:#021018;font-weight:800;
  box-shadow:0 0 24px #00f5ff88;
}

/* لوحة التفاصيل */
#panel{
  position:absolute;z-index:25;right:12px;top:74px;bottom:12px;
  width:min(350px,86vw);
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:16px;
  overflow-y:auto;display:none;
  box-shadow:0 20px 70px #000c, 0 0 0 1px #4a2dff44 inset;
  backdrop-filter:blur(18px);
  animation:slideIn .35s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
#panel::-webkit-scrollbar{width:7px}
#panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5ff,#ff006e);border-radius:4px}

#panel h2{
  margin:0 0 4px;font-size:21px;font-weight:800;
  background:linear-gradient(90deg,#00f5ff,#ffe600,#ff006e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px #00f5ff77);
}
#panel .enName{font-size:11px;color:#8fb8e8;margin:0 0 14px;letter-spacing:1px;font-weight:600}
#panel h3{
  font-size:12px;margin:20px 0 10px;letter-spacing:.6px;font-weight:700;
  color:#ffe600;
  padding-bottom:7px;
  border-bottom:1px solid #4a2dff66;
  text-shadow:0 0 12px #ffe60066;
}
#panel p{font-size:12.5px;line-height:1.9;color:#d9ecff;margin:0 0 8px}

.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.stat{
  background:linear-gradient(135deg,rgba(74,45,255,.15),rgba(181,55,242,.15));
  border:1px solid #4a2dff77;border-radius:12px;
  padding:10px 11px;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;top:0;right:0;
  width:3px;height:100%;
  background:linear-gradient(180deg,#00f5ff,#ff006e);
  box-shadow:0 0 12px #00f5ff;
}
.stat span{display:block;font-size:10px;color:#a8b8e8;margin-bottom:4px;font-weight:600}
.stat b{font-size:15px;color:#fff;font-weight:800;letter-spacing:.3px}
.stat b em{font-size:10px;color:#a8b8e8;font-style:normal;font-weight:600}

#branches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#branches button{
  width:100%;padding:11px 8px;font-size:11.5px;font-weight:600;
  border:1px solid #4a2dff88;border-radius:11px;
  background:linear-gradient(135deg,rgba(74,45,255,.2),rgba(181,55,242,.15));
  color:#e8f4ff;cursor:pointer;
  transition:.16s;text-align:center;
}
#branches button:hover{
  background:linear-gradient(135deg,#4a2dff,#b537f2);
  border-color:#00f5ff;color:#fff;
  box-shadow:0 0 20px #b537f288;
  transform:translateY(-1px);
}
#branches button.active{
  background:linear-gradient(135deg,#ffe600,#ff006e);
  border-color:#ffe600;color:#021018;font-weight:800;
  box-shadow:0 0 24px #ffe60088;
}

.panelActions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.panelActions button{
  flex:1;min-width:110px;padding:12px;
  border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;
  border:1px solid #4a2dff;
  background:linear-gradient(135deg,#1a1060,#2a1580);
  color:#fff;
  transition:.16s;
  box-shadow:0 4px 16px #4a2dff44;
}
.panelActions button:hover{
  background:linear-gradient(135deg,#4a2dff,#b537f2);
  border-color:#00f5ff;
  box-shadow:0 0 24px #b537f288;
  transform:translateY(-1px);
}
.panelActions button.danger{
  border-color:#ff006e;
  background:linear-gradient(135deg,#5a0030,#8a0040);
  color:#ffb0d0;
}
.panelActions button.danger:hover{
  background:linear-gradient(135deg,#ff006e,#b537f2);
  color:#fff;
  box-shadow:0 0 24px #ff006e88;
}

#close{
  position:absolute;left:12px;top:12px;width:32px;height:32px;
  background:linear-gradient(135deg,#4a2dff,#b537f2);
  color:#fff;border:0;border-radius:10px;
  cursor:pointer;font-size:15px;font-weight:800;
  transition:.16s;
  box-shadow:0 4px 16px #4a2dff66;
}
#close:hover{
  background:linear-gradient(135deg,#ff006e,#b537f2);
  transform:rotate(90deg);
  box-shadow:0 0 24px #ff006e88;
}

/* قائمة المحافظات */
#sideList{
  position:absolute;z-index:22;left:12px;top:74px;bottom:12px;
  width:min(260px,80vw);
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:13px;
  display:flex;flex-direction:column;
  box-shadow:0 20px 70px #000c, 0 0 0 1px #4a2dff44 inset;
  backdrop-filter:blur(18px);
  transition:transform .3s ease,opacity .3s ease;
}
#sideList.hidden{transform:translateX(-115%);opacity:0;pointer-events:none}
#sideList h4{
  margin:2px 0 11px;font-size:12px;font-weight:700;letter-spacing:.5px;
  display:flex;justify-content:space-between;align-items:center;
  color:#ffe600;
  text-shadow:0 0 10px #ffe60077;
}
#search{
  width:100%;padding:10px 12px;margin-bottom:10px;
  background:rgba(20,10,50,.8);
  border:1px solid #4a2dff88;border-radius:11px;
  color:#fff;font-size:12px;font-family:inherit;outline:none;
  transition:.16s;
}
#search:focus{
  border-color:#00f5ff;
  box-shadow:0 0 0 3px #00f5ff33,0 0 20px #00f5ff66;
}
#search::placeholder{color:#7a8fc0}

#provList{overflow-y:auto;flex:1;padding-left:2px}
#provList::-webkit-scrollbar{width:6px}
#provList::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5ff,#b537f2);border-radius:4px}
.provItem{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:11px;cursor:pointer;
  font-size:12.5px;color:#d9ecff;transition:.15s;
  border:1px solid transparent;
  font-weight:500;
}
.provItem:hover{
  background:linear-gradient(90deg,rgba(74,45,255,.25),rgba(181,55,242,.15));
  border-color:#4a2dff;
}
.provItem.active{
  background:linear-gradient(90deg,rgba(0,245,255,.3),rgba(255,0,110,.2));
  border-color:#00f5ff;color:#fff;font-weight:700;
  box-shadow:0 0 16px #00f5ff55;
}
.provItem .swatch{
  width:12px;height:12px;border-radius:4px;flex-shrink:0;
  box-shadow:0 0 12px currentColor,0 0 6px currentColor inset;
}
.provItem .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* الأدوات */
#tools{
  position:absolute;bottom:15px;left:12px;z-index:23;
  display:flex;flex-wrap:wrap;gap:8px;max-width:min(360px,62vw);
}

/* العُقد */
.node{width:0;height:0;cursor:pointer;z-index:2}
.node .dot{
  position:absolute;left:-8px;top:-8px;
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffffff,#00f5ff 45%,#ff006e);
  border:2px solid #fff;
  box-shadow:0 0 12px #00f5ff,0 0 26px #ff006e,0 0 40px #00f5ff88;
  animation:pulse 2.4s infinite;
  transition:.2s;
}
.node:hover .dot{
  transform:scale(1.5);
  background:radial-gradient(circle at 35% 35%,#fff,#ffe600 45%,#ff006e);
  box-shadow:0 0 20px #ffe600,0 0 40px #ff006e;
}
@keyframes pulse{
  0%,100%{
    box-shadow:0 0 0 0 #00f5ff99,0 0 12px #00f5ff,0 0 26px #ff006e;
  }
  55%{
    box-shadow:0 0 0 12px #00f5ff00,0 0 24px #00f5ff,0 0 40px #ff006e;
  }
}
.node-label{
  position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
  background:rgba(10,4,30,.94);
  border:1px solid #4a2dff;
  border-radius:9px;padding:4px 10px;
  color:#fff;white-space:nowrap;font-size:11px;font-weight:600;
  pointer-events:none;
  box-shadow:0 4px 16px #4a2dff88,0 0 16px #00f5ff44;
  transition:.18s;
}
.node:hover .node-label{
  background:linear-gradient(90deg,#ff006e,#b537f2);
  border-color:#ffe600;color:#fff;
  box-shadow:0 0 20px #ffe600aa;
}

/* إشعار */
#toast{
  position:absolute;z-index:70;bottom:80px;right:50%;transform:translateX(50%) translateY(20px);
  background:linear-gradient(135deg,rgba(74,45,255,.95),rgba(181,55,242,.9));
  border:1px solid #00f5ff;
  border-radius:13px;
  padding:12px 20px;font-size:13px;color:#fff;font-weight:600;
  opacity:0;pointer-events:none;transition:.3s;
  box-shadow:0 10px 44px #4a2dff88,0 0 24px #00f5ff88;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}

/* الجوال */
@media(max-width:720px){
  #sideList{width:min(250px,74vw);top:120px}
  #panel{width:min(330px,92vw);top:120px}
  #tools{max-width:calc(100vw - 24px);bottom:78px}
  .tool{padding:9px 12px;font-size:11px}
  #header{top:8px;left:8px;right:8px}
  .logo{padding:8px 11px}
  .logo strong{font-size:12px}
  .status{font-size:10px;padding:8px 11px}
}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">
  <div class="ring"></div>
  <h1>IRAQ MIND MAP 3D</h1>
  <div class="sub">الخريطة الذهنية الجغرافية للعراق</div>
  <div id="bar"><i></i></div>
  <p id="loadText">جاري تهيئة المحرك ثلاثي الأبعاد...</p>
</div>

<div id="header">
  <div class="logo">
    <strong>IRAQ MIND MAP 3D</strong><br>
    <small>الخريطة الذهنية الجغرافية</small>
  </div>
  <div class="status">
    <span class="dotlive"></span>
    <span id="status">جاري التحميل...</span>
  </div>
</div>

<div id="sideList">
  <h4>
    <span>محافظات العراق</span>
    <span id="provCount" style="color:#7a8fc0;font-size:10px">—</span>
  </h4>
  <input id="search" type="text" placeholder="🔍 ابحث عن محافظة...">
  <div id="provList"></div>
</div>

<div id="panel">
  <button id="close" title="إغلاق">✕</button>
  <h2 id="provinceName">المحافظة</h2>
  <p class="enName" id="provinceEn"></p>
  <p id="provinceInfo">معلومات المحافظة</p>

  <div class="statGrid" id="statGrid"></div>

  <h3>✦ الفروع الذهنية</h3>
  <div id="branches"></div>

  <h3>✦ المعلومات الإدارية</h3>
  <div id="adminInfo"></div>

  <div class="panelActions">
    <button id="zoomProvince">تكبير المحافظة</button>
    <button id="showAll">عرض العراق كاملاً</button>
    <button id="clearBranch" class="danger">مسح الفروع</button>
  </div>
</div>

<div id="tools">
  <button class="tool" id="reset">🏠 إعادة العرض</button>
  <button class="tool on" id="terrain">⛰️ تضاريس 3D</button>
  <button class="tool on" id="labels">🏷️ الأسماء</button>
  <button class="tool" id="toggleList">📋 القائمة</button>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   IRAQ MIND MAP 3D — VIVID NEON EDITION
   ========================================================= */

const PROVINCE_META = [
 {ar:'بغداد',    en:'Baghdad',        cap:'بغداد',     area:4555,   pop:8126000, c:[44.366,33.315], note:'العاصمة الاتحادية ومركز الثقل السياسي والاقتصادي في العراق.'},
 {ar:'البصرة',   en:'Basra',          cap:'البصرة',    area:19070,  pop:3000000, c:[47.783,30.508], note:'الميناء الرئيسي وقلب العراق الاقتصادي البحري.'},

 {ar:'كربلاء',   en:'Karbala',        cap:'كربلاء',    area:5034,   pop:1200000, c:[44.024,32.616], note:'مدينة الإمام الحسين ومحطة زيارة عالمية كبرى.'},

 {ar:'المثنى',   en:'Muthanna',       cap:'السماوة',   area:51740,  pop:800000,  c:[45.280,31.311], note:'محافظة صحراوية واسعة على الحدود الجنوبية.'},
 {ar:'القادسية', en:'Qadisiyyah',     cap:'الديوانية', area:8153,   pop:1300000, c:[44.925,31.992], note:'سلة الحبوب في الفرات الأوسط.'},
 {ar:'واسط',     en:'Wasit',          cap:'الكوت',     area:17153,  pop:1400000, c:[45.818,32.512], note:'تحتضن سد الكوت وأراضي زراعية خصبة.'},
 {ar:'صلاح الدين',en:'Saladin',       cap:'تكريت',     area:24751,  pop:1600000, c:[43.678,34.607], note:'محافظة تاريخية على ضفاف دجلة وسط العراق.'},
 {ar:'كركوك',    en:'Kirkuk',         cap:'كركوك',     area:9679,   pop:1600000, c:[44.392,35.468], note:'مدينة النفط والتعدد القومي في شمال العراق.'},
 {ar:'دهوك',     en:'Duhok',          cap:'دهوك',      area:6553,   pop:1300000, c:[42.988,36.867], note:'محافظة جبلية خلابة على الحدود الشمالية.'},
 {ar:'السليمانية',en:'Sulaymaniyah',  cap:'السليمانية',area:17023,  pop:2000000, c:[45.436,35.561], note:'مركز ثقافي كردي وموطن جبال حمرين وأزمر.'}
];

/* 🎨 باليت نيون زاهية — 18 لون */
const COLORS = [
  '#FF006E', // وردي ساخن
  '#FB5607', // برتقالي ناري
  '#FFBE0B', // أصفر ذهبي
  '#8338EC', // بنفسجي كهربائي
  '#3A86FF', // أزرق سماوي
  '#06FFA5', // أخضر نعناعي
  '#FF4D6D', // مرجاني
  '#00F5D4', // فيروزي
  '#F15BB5', // وردي فوشيا
  '#9B5DE5', // بنفسجي فاتح
  '#FEE440', // أصفر ليموني

function norm(s){
  return String(s||'')
    .replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و')
    .replace(/ة/g,'ه').replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/^ال/,'').replace(/[\s\-_]+/g,'').trim().toLowerCase();
}

const META_INDEX = new Map();
PROVINCE_META.forEach(m=>{
  META_INDEX.set(norm(m.ar), m);
  META_INDEX.set(norm(m.en), m);
});
function lookupMeta(name){ return META_INDEX.get(norm(name)) || null; }

function ensureOSMToGeoJSON(){
  if(osmtogeojsonReady) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    if(window.osmtogeojson){ osmtogeojsonReady = true; return resolve(); }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0/osmtogeojson.js';
    s.onload = ()=>{ osmtogeojsonReady = true; resolve(); };
    s.onerror = ()=> reject(new Error('فشل تحميل osmtogeojson'));
    document.head.appendChild(s);
  });
}

const OVERPASS_SERVERS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];

const OVERPASS_QUERY = `[out:json][timeout:25];
area["ISO3166-1"="IQ"]["admin_level"="2"]->.a;
relation["boundary"="administrative"]["admin_level"="4"](area.a);
out body geom;`;

async function fetchOverpass(query, server, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(server, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data=' + encodeURIComponent(query),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err){
    clearTimeout(timer);
    throw err;
  }
}

async function loadProvincesFromOSM(){
  let lastErr = null;
  for(let si=0; si<OVERPASS_SERVERS.length; si++){
    try{
      const data = await fetchOverpass(OVERPASS_QUERY, OVERPASS_SERVERS[si], 12000);
      if(data && Array.isArray(data.elements) && data.elements.length) return data;
      lastErr = new Error('empty result');
    } catch(err){
      lastErr = err;
      console.warn('Overpass fail:', OVERPASS_SERVERS[si], err.message);
    }
  }
  throw lastErr || new Error('تعذر الاتصال بـ Overpass');
}

function bboxOf(geometry){
  let minX=180,minY=90,maxX=-180,maxY=-90;
  (function walk(c){
    if(typeof c[0] === 'number'){
      if(c[0]<minX) minX=c[0]; if(c[0]>maxX) maxX=c[0];
      if(c[1]<minY) minY=c[1]; if(c[1]>maxY) maxY=c[1];
    } else { for(let i=0;i<c.length;i++) walk(c[i]); }
  })(geometry.coordinates);
  return [minX,minY,maxX,maxY];
}

function buildProvinces(geojson){
  const list = [];
  const features = (geojson && geojson.features) || [];

  features.forEach((f, i)=>{
    if(!f.geometry) return;
    const t = f.geometry.type;
    if(t !== 'Polygon' && t !== 'MultiPolygon') return;

    const tags = (f.properties && f.properties.tags) || {};
    const rawName = tags['name:ar'] || tags.name || tags['name:en'] || ('محافظة ' + (i+1));
    const meta = lookupMeta(rawName) || lookupMeta(tags['name:en']) || lookupMeta(tags.name) || null;

    const bb = bboxOf(f.geometry);
    const bboxCenter = [(bb[0]+bb[2])/2, (bb[1]+bb[3])/2];

    let osmId = null;
    if(f.properties && f.properties.id != null) osmId = f.properties.id;
    else if(f.id != null) osmId = f.id;

    list.push({
      idx: list.length,
      name: meta ? meta.ar : rawName,
      nameEn: tags['name:en'] || (meta ? meta.en : '') || '',
      color: COLORS[list.length % COLORS.length],
      center: meta ? meta.c : bboxCenter,
      bbox: bb,
      cap: meta ? meta.cap : '',
      area: meta ? meta.area : null,
      pop: meta ? meta.pop : null,
      note: meta ? meta.note : '',
      geometry: f.geometry,
      osmId: osmId
    });
  });

  if(!list.length){
    PROVINCE_META.forEach((m,i)=>{
      list.push({
        idx:i, name:m.ar, nameEn:m.en,
        color: COLORS[i % COLORS.length],
        center:m.c, bbox:[m.c[0]-0.25, m.c[1]-0.25, m.c[0]+0.25, m.c[1]+0.25],
        cap:m.cap, area:m.area, pop:m.pop, note:m.note,
        geometry:null, osmId:null
      });
    });
  }
  return list;
}

function selectProvince(idx){
  const p = PROVINCES.find(x=>x.idx === idx);
  if(!p) return;

  if(selectedIdx !== null){
    try{ map.setFeatureState({source:'provinces', id:selectedIdx}, {selected:false}); }catch(e){}
  }
  selectedIdx = idx;
  if(p.geometry){
    try{ map.setFeatureState({source:'provinces', id:idx}, {selected:true}); }catch(e){}
  }

  syncActiveItem(idx);
  clearBranch(true);

  const pn = $('provinceName');
  if(pn) pn.textContent = p.name;
  const pe = $('provinceEn');
  if(pe) pe.textContent = p.nameEn ? p.nameEn.toUpperCase() : '';
  const pi = $('provinceInfo');
  if(pi) pi.textContent = p.note || 'محافظة من محافظات العراق.';

  const grid = $('statGrid');
  if(grid){
    grid.innerHTML = '';
    const stats = [
      ['المركز', p.cap || '—', ''],
      ['المساحة', p.area ? fmtNum(p.area) : '—', 'كم²'],
      ['السكان', p.pop ? fmtNum(p.pop) : '—', 'نسمة'],
      ['الكثافة', (p.area && p.pop) ? fmtNum(Math.round(p.pop/p.area)) : '—', 'ن/كم²']
    ];
    stats.forEach(([label,val,unit])=>{
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = '<span>'+label+'</span><b>'+val+(unit ? ' <em>'+unit+'</em>' : '')+'</b>';
      grid.appendChild(d);
    });
  }

  const box = $('branches');
  if(box){
    box.innerHTML = '';
    BRANCHES.forEach(b=>{
      const btn = document.createElement('button');
      btn.textContent = b.icon + ' ' + b.label;
      btn.dataset.key = b.key;
      btn.addEventListener('click', ()=>runBranch(b, btn));
      box.appendChild(btn);
    });
  }

  const admin = $('adminInfo');
  if(admin){
    admin.innerHTML = '';
    [
      ['الاسم العربي', p.name],
      ['الاسم الإنجليزي', p.nameEn || '—'],
      ['المركز الإداري', p.cap || '—'],
      ['معرّف OSM', p.osmId != null ? p.osmId : 'غير متوفر'],
      ['المصدر', p.geometry ? 'OpenStreetMap' : 'بيانات محلية']
    ].forEach(([k,v])=>{
      const el = document.createElement('p');
      el.textContent = k + ': ' + v;
      admin.appendChild(el);
    });
  }

  const panel = $('panel');
  if(panel) panel.style.display = 'block';

  if(p.bbox){
    map.fitBounds([[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]], {
      padding:{top:90,bottom:90,left:60,right:360},
      pitch:58, bearing:-6, duration:1400, maxZoom:9.5
    });
  } else {
    map.flyTo({center:p.center, zoom:8, pitch:60, duration:1200});
  }
}

function clearBranch(silent){
  ['branch-fill','branch-line','branch-point'].forEach(id=>{
    try{ if(map.getLayer(id)) map.removeLayer(id); }catch(e){}
  });
  try{ if(map.getSource('branch')) map.removeSource('branch'); }catch(e){}
  document.querySelectorAll('#branches button').forEach(b=>b.classList.remove('active'));
  if(!silent) toast('✨ تم مسح الفروع');
}

async function runBranch(branch, btn){
  if(selectedIdx === null) return;
  const p = PROVINCES.find(x=>x.idx === selectedIdx);
  if(!p) return;
  if(p.osmId === null || p.osmId === undefined){
    toast('⚠️ لا تتوفر بيانات OSM لهذه المحافظة');
    return;
  }
  if(btn.classList.contains('active')){ clearBranch(); return; }

  clearBranch(true);
  btn.classList.add('active');
  toast('⏳ جاري جلب ' + branch.label + '...', 8000);

  const areaId = 3600000000 + Number(p.osmId);
  const query =
    '[out:json][timeout:45];\n' +
    'area(' + areaId + ')->.a;\n' +
    branch.q + '(area.a);\n' +
    'out geom 900;';

  let data = null;
  for(const server of OVERPASS_SERVERS){
    try{
      data = await fetchOverpass(query, server, 30000);
      if(data && data.elements && data.elements.length) break;
      data = null;
    } catch(err){ console.warn('branch fail:', err.message); }
  }

  if(!data || !data.elements || !data.elements.length){
    btn.classList.remove('active');
    toast('❌ لم يتم العثور على بيانات');
    return;
  }

  try{
    await ensureOSMToGeoJSON();
    let gj = window.osmtogeojson(data, {flatProperties:true});
    if(gj && typeof gj.then === 'function') gj = await gj;

    const feats = (gj.features || []).filter(f=>f.geometry);
    if(!feats.length) throw new Error('empty');

    map.addSource('branch', {
      type:'geojson',
      data:{ type:'FeatureCollection', features:feats }
    });

    // 🎨 فرع بتدرج ألوان نيون
    map.addLayer({
      id:'branch-fill', type:'fill', source:'branch',
      paint:{
        'fill-color':['case',
          ['==',['geometry-type'],'Polygon'], '#FF006E',
          '#00F5FF'
        ],
        'fill-opacity':0.22,
        'fill-outline-color':'#FFE600'
      }
    });

    map.addLayer({
      id:'branch-line', type:'line', source:'branch',
      paint:{
        'line-color':['case',
          ['==',['geometry-type'],'LineString'], '#00F5FF',
          '#FFE600'
        ],
        'line-width':2.5,
        'line-opacity':0.95,
        'line-blur':0.5
      }
    });

    map.addLayer({
      id:'branch-point', type:'circle', source:'branch',
      paint:{
        'circle-radius':5.5,
        'circle-color':['case',
          ['==',['geometry-type'],'Point'], '#FFE600',
          '#FF006E'
        ],
        'circle-stroke-width':1.8,
        'circle-stroke-color':'#ffffff',
        'circle-opacity':0.98
      }
    });

    toast('✨ ' + branch.label + ': ' + feats.length + ' عنصر');
  } catch(err){
    btn.classList.remove('active');
    toast('❌ تعذر عرض البيانات');
  }
}

});

$('toggleList').addEventListener('click', function(){
  $('sideList').classList.toggle('hidden');
  this.classList.toggle('on', !$('sideList').classList.contains('hidden'));
});

$('clearBranch').addEventListener('click', ()=>clearBranch());

function setupMapBase(){
  try{
    map.addSource('iraq-dem', {
      type:'raster-dem',
      tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize:256, encoding:'terrarium', maxzoom:14
    });
    map.setTerrain({ source:'iraq-dem', exaggeration:1.35 });
  }catch(err){ console.warn('terrain', err); }

  // 💡 إضاءة أقوى للألوان
  try{
    if(map.setLight){
      map.setLight({ anchor:'viewport', color:'#ffffff', intensity:0.85, position:[1.5,220,50] });
    }
  }catch(err){ console.warn('light', err); }

  try{
    map.addLayer({
      id:'iraq-hillshade', type:'hillshade', source:'iraq-dem',
      paint:{
        'hillshade-exaggeration':0.55,
        'hillshade-shadow-color':'#1a0f3d',
        'hillshade-highlight-color':'#ffe0ff',
        'hillshade-accent-color':'#3a1e6b'
      }
    });
  }catch(err){ console.warn('hillshade', err); }

  // 🌌 ضباب بنفسجي زاهي
  try{
    map.setFog({
      range:[-0.6,2.2], color:'#0a0425', 'horizon-blend':0.25,
      'high-color':'#1a0045', 'space-color':'#02010a', 'star-intensity':0.6
    });
  }catch(err){ console.warn('fog', err); }

  try{
    map.addLayer({
      id:'sky', type:'sky',
      paint:{
        'sky-type':'atmosphere',
        'sky-atmosphere-sun':[0,45],
        'sky-atmosphere-sun-intensity':10
      }
    });
  }catch(err){ console.warn('sky', err); }
}

async function loadOSMInBackground(){
  try{
    const osm = await withTimeout(loadProvincesFromOSM(), 25000);
    if(!osm) throw new Error('no data');

    await ensureOSMToGeoJSON();
    let geojson = window.osmtogeojson(osm, {flatProperties:false});
    if(geojson && typeof geojson.then === 'function') geojson = await geojson;

    if(!geojson || !geojson.features || !geojson.features.length) throw new Error('empty');
    const newList = buildProvinces(geojson);
    if(!newList.length || !newList.some(x=>x.geometry)) throw new Error('no geometry');

    clearMapData();
    PROVINCES = newList;
    addProvinceLayers();
    osmLoaded = true;

    setStatus('تم تحميل <b>' + PROVINCES.length + '</b> محافظة');
    toast('✨ تم تحديث الحدود من OpenStreetMap');
  }catch(err){
    console.warn('OSM bg load fail:', err.message);
    if(!osmLoaded) setStatus('وضع محلي — ' + PROVINCES.length + ' محافظة');
  }
}

map.on('load', ()=>{
  mapLoaded = true;
  try{
    progress(30, 'جاري إعداد التضاريس...');
    setupMapBase();

    progress(60, 'جاري رسم المحافظات...');
    PROVINCES = buildProvinces(null);
    addProvinceLayers();

    progress(100, 'جاهز!');
    setStatus('وضع محلي — جاري تحديث الحدود...');
    setTimeout(hideLoading, 400);
    loadOSMInBackground();

    setTimeout(()=>{
      map.easeTo({ center:[43.8,33.2], zoom:5.2, pitch:52, bearing:-8, duration:1400 });
    }, 200);
  }catch(err){
    console.error('Setup error:', err);
    progress(100, '⚠️ ' + err.message);
    const el = $('loadText');
    if(el){
      el.innerHTML = '⚠️ خطأ: ' + err.message +
        '<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>';
    }
    setTimeout(hideLoading, 2500);
  }
});

setTimeout(()=>{
  if(!mapLoaded){
    const el = $('loadText');
    if(el){
      el.innerHTML = '⚠️ تأخر تحميل الخريطة. تحقق من اتصالك.' +
        '<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>';
    }
  }
}, 25000);

if(window.innerWidth < 720){
  setTimeout(()=>$('sideList').classList.add('hidden'), 3500);
}

map.on('mouseout', ()=>{ map.getCanvas().style.cursor = ''; });
</script>
</body>
</html>
